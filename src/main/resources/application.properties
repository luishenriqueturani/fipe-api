# Banco de dados
quarkus.datasource.db-kind=postgresql
quarkus.datasource.username=fipe_user
quarkus.datasource.password=fipe_pass
quarkus.datasource.jdbc.url=jdbc:postgresql://192.168.1.34:5432/fipe

# Hibernate
quarkus.hibernate-orm.database.generation=update

# Transaction timeout (em segundos) - aumentar para processar grandes volumes
quarkus.transaction-manager.default-transaction-timeout=1800

# Pool de conexões
quarkus.datasource.jdbc.min-size=5
quarkus.datasource.jdbc.max-size=20

# JWT
# Validar tokens via JWKS publicado pela própria API
mp.jwt.verify.publickey.location=http://localhost:8080/.well-known/jwks.json
mp.jwt.verify.issuer=https://fipe-api.local
# Cache do JWKS para evitar bloqueio do thread de I/O
smallrye.jwt.jwks.refresh-interval=3600
smallrye.jwt.jwks.cache-size=10
# Timeout para requisições JWKS (em segundos)
smallrye.jwt.jwks.connect-timeout=5
smallrye.jwt.jwks.read-timeout=5
# Emissão programática: removido smallrye.jwt.sign.key.location
# Vida curta recomendada (defina no emissor)

# Segurança Elytron (desabilitar usuários em arquivo para API privada por cliente)
quarkus.security.users.file.enabled=false

# GraphQL
# Rota padrão: /graphql
# Interface GraphiQL: /graphql-ui (habilitada por padrão em dev mode)
quarkus.smallrye-graphql.ui.enable=true